; Export presets used by .github/workflows/build.yml (godot --export-release "<name>").
; JSON content in data/ and the font and icon licenses are not Godot resources, so include_filter adds them.
; macOS: universal .app zipped by Godot, ad-hoc signed and not notarized (Gatekeeper asks on first launch).
; macOS 26 won't launch it with Godot's built-in signature, so build.yml re-signs it with Apple's codesign.
; Its bundle versions are left empty so they come from application/config/version.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, */fonts/OFL.txt, */icons/LICENSE"
exclude_filter=""
export_path="../build/linux/Headland.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

