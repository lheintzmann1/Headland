name: Build game

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: Linux
            dir: linux
            file: Headland.x86_64
          - name: Windows
            preset: Windows
            dir: windows
            file: Headland.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-mono-linux-windows

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSLo editor.zip "$base/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q editor.zip && rm editor.zip
          curl -fsSLo templates.tpz "$base/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # Keep only the desktop templates we export, so the cache stays small.
          find templates -type f ! -name 'version.txt' ! -name 'linux_*' ! -name 'windows_*' -delete
          find templates -mindepth 1 -type d -empty -delete
          ls -la templates

      - name: Install Godot
        run: |
          ln -sf ~/godot/Godot_v${GODOT_RELEASE}_mono_linux_x86_64/Godot_v${GODOT_RELEASE}_mono_linux.x86_64 ~/godot/godot
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          ~/godot/godot --version

      - name: Import assets
        run: ~/godot/godot --headless --path game --import

      - name: Export ${{ matrix.name }}
        run: |
          mkdir -p build/${{ matrix.dir }}
          ~/godot/godot --headless --path game --export-release "${{ matrix.preset }}" "../build/${{ matrix.dir }}/${{ matrix.file }}"
          test -f "build/${{ matrix.dir }}/${{ matrix.file }}"
          ls -la build/${{ matrix.dir }}

      # Archive before uploading so the Linux executable bit survives.
      - name: Package
        run: |
          cd build/${{ matrix.dir }}
          if [ "${{ matrix.dir }}" = linux ]; then
            tar -czf "../Headland-${{ matrix.dir }}.tar.gz" .
          else
            zip -qr "../Headland-${{ matrix.dir }}.zip" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Headland-${{ matrix.dir }}
          path: build/Headland-${{ matrix.dir }}.*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
