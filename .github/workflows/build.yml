name: Build game

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  export:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: Linux
            dir: linux
            file: Headland.x86_64
          - name: Windows
            preset: Windows
            dir: windows
            file: Headland.exe
          - name: macOS
            preset: macOS
            dir: macos
            file: Headland.zip
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the game version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's|^config/version="\(.*\)"$|\1|p' game/project.godot)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match config/version=\"$version\" in game/project.godot"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-mono-linux-windows-macos

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSLo editor.zip "$base/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q editor.zip && rm editor.zip
          curl -fsSLo templates.tpz "$base/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # Keep only the desktop templates we export, so the cache stays small.
          find templates -type f ! -name 'version.txt' ! -name 'linux_*' ! -name 'windows_*' ! -name 'macos.zip' -delete
          find templates -mindepth 1 -type d -empty -delete
          ls -la templates

      - name: Install Godot
        run: |
          ln -sf ~/godot/Godot_v${GODOT_RELEASE}_mono_linux_x86_64/Godot_v${GODOT_RELEASE}_mono_linux.x86_64 ~/godot/godot
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          ~/godot/godot --version

      - name: Import assets
        run: ~/godot/godot --headless --path game --import

      - name: Export ${{ matrix.name }}
        run: |
          mkdir -p build/${{ matrix.dir }}
          ~/godot/godot --headless --path game --export-release "${{ matrix.preset }}" "../build/${{ matrix.dir }}/${{ matrix.file }}"
          test -f "build/${{ matrix.dir }}/${{ matrix.file }}"
          ls -la build/${{ matrix.dir }}

      # Archive before uploading so the Linux executable bit survives. Godot already zips the macOS .app.
      - name: Package
        run: |
          cd build/${{ matrix.dir }}
          if [ "${{ matrix.dir }}" = linux ]; then
            tar -czf "../Headland-${{ matrix.dir }}.tar.gz" .
          elif [ "${{ matrix.dir }}" = macos ]; then
            mv "${{ matrix.file }}" "../Headland-${{ matrix.dir }}.zip"
          else
            zip -qr "../Headland-${{ matrix.dir }}.zip" .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Headland-${{ matrix.dir }}
          path: build/Headland-${{ matrix.dir }}.*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
